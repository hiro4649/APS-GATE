name: APS-GATE

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: write
  checks: read

jobs:
  aps-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate AI-authored PR
        uses: hiro4649/APS-GATE@8712bbf527b033d0bc0fcd437df1e4d28089d943
        with:
          profile: standard
          github-token: ${{ secrets.GITHUB_TOKEN }}
          trusted-approvers: ""
          required-checks: "test"
          post-comment: "true"

      - name: Upload APS-GATE safe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aps-gate-safe-artifact
          path: aps-gate.safe.json
